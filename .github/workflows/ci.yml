name: CI

on:
  pull_request:
  push:
    tags:
      - '*'

jobs:
  check:
    name: Check (typecheck + lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run check
        run: pnpm run check

  # 打 tag 后自动发布至 npm，使用 trusted publishing
  publish:
    name: Publish to npm (trusted publishing)
    needs: check
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write   # npm OIDC 换取发布令牌 / 生成 provenance
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Publish to npm
        run: npm publish
